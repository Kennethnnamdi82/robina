name: Android build and release
on:
  push:
    branches: [main, feature/rivals-3d-migration]
    paths: ['robina/**', 'backend/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Public production API URL (only needed before repository variables are configured)'
        type: string
      privy_app_id:
        description: 'Public Privy app ID'
        type: string
      reown_project_id:
        description: 'Public Reown project ID'
        type: string
permissions:
  contents: read
concurrency:
  group: rivals-android-release
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: robina
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || inputs.api_url }}
      VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID || inputs.privy_app_id }}
      VITE_REOWN_PROJECT_ID: ${{ vars.VITE_REOWN_PROJECT_ID || inputs.reown_project_id }}
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      ANDROID_DISTRIBUTION_REPOSITORY: ${{ vars.ANDROID_DISTRIBUTION_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: robina/package-lock.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: robina/android
      - name: Android SDK (cloud only)
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - run: npm ci --include=dev
      - name: Frontend checks
        run: |
          npm run typecheck
          npm test -- --maxWorkers 1
      - name: Authentication backend regressions
        run: |
          npm --prefix ../backend ci
          npm --prefix ../backend test
      - name: Production version
        run: node scripts/android/version.mjs
      - name: Build and package the game
        run: |
          npm run build
          npx cap sync android
          node scripts/android/verify-package.mjs
      - name: Compile signed production APK
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_STORE_PASSWORD" && test -n "$ANDROID_KEY_PASSWORD" && test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/rivals-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          cd android
          bash gradlew --no-daemon assembleRelease testReleaseUnitTest lintRelease
          cd ..
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/RIVALS-RIVAL-HEIST.apk
          node scripts/android/verify-package.mjs release/RIVALS-RIVAL-HEIST.apk
      - name: Compile testing APK (never a production release)
        if: github.ref != 'refs/heads/main'
        run: |
          cd android
          bash gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: rivals-android-signed-release
          path: robina/release/*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref != 'refs/heads/main'
        with:
          name: rivals-android-DEBUG-testing-only
          path: robina/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Publish through restricted public-repository deploy key
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_DISTRIBUTION_SSH_KEY: ${{ secrets.ANDROID_DISTRIBUTION_SSH_KEY }}
        run: node scripts/android/deliver.mjs
